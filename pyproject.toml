[project]
name = "bal-nms-robustness"
version = "1.0.0"
description = "Robustness and equivalence analysis of detector post-processing (NMS) for the automated BAL differential"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-posthocs>=0.9",
    "statsmodels>=0.14",
    "duckdb>=0.10",
    "matplotlib>=3.8",
    "Pillow>=10",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "scikit-learn>=1.3",
    "krippendorff>=0.7",
]

[tool.setuptools.packages.find]
include = ["core*", "nms*"]

[project.scripts]
balc = "main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
